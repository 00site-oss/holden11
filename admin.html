<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holden · Website Admin</title>
<meta name="description" content="Holden website administration and visual page editor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0f2742;--navy2:#1a3b64;--bg:#e9edf3;--surface:#fff;--ink:#1b2735;--muted:#667587;--line:#cfd7e1;--line2:#e4e9f0;--accent:#1d5fd1;--accentD:#154aa6;--accentL:#e8f0fd;--ok:#1c7c4d;--danger:#c0392b;--warn:#b26a00;--r:4px;--shadow:0 1px 3px rgba(15,39,66,.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:13px/1.45 'IBM Plex Sans','Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:6px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
button:hover:not(:disabled){background:var(--accentL);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accentL);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accentD);color:#fff}
button.primary:hover:not(:disabled){background:var(--accentD);border-color:var(--accentD)}
button.danger{color:var(--danger)}
button.danger:hover:not(:disabled){background:#fdecea;border-color:var(--danger)}
button.wide{width:100%;margin-bottom:8px}
button.mini{padding:4px 8px;font-size:12px}
svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;line-height:1.5}
textarea.code{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:var(--r);background:#fff;flex:none;cursor:pointer}
input[type=range]{width:100%}
input.hex{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* header */
#top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;flex:none}
#top .logo{width:32px;height:32px;border-radius:4px;background:var(--accent);display:grid;place-items:center}
#top .logo svg{width:19px;height:19px}
#top .ttl{font-weight:600;font-size:15px;line-height:1.15}
#top .sub{font-size:11px;color:#9fb3cc}
#top .sep{width:1px;height:26px;background:#2f4d73}
#top .loc{font-size:12px;color:#9fb3cc}
#top .sp{flex:1}
#top .status{font-size:12px;color:#9fe0bd;display:flex;align-items:center;gap:6px}
#top .status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
#top .status.dirty{color:#ffd58a}
#top a.vs{color:#fff;text-decoration:none;border:1px solid #3a5a85;border-radius:var(--r);padding:6px 11px;font-weight:500}
#top a.vs:hover{background:var(--navy2)}
#top button.primary{padding:7px 16px;border-color:#4d86e6}

/* toolbar */
#toolbar{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:7px 14px;flex-wrap:wrap;flex:none}
#toolbar .vr{width:1px;height:24px;background:var(--line);margin:0 4px}
#toolbar .sp{flex:1}
#toolbar .dev{padding:6px 9px}
#toolbar select{width:auto;padding:6px 8px}
#vp{font-size:11px;color:var(--muted);margin-left:2px}
.pop{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:70;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(15,39,66,.2);padding:5px;min-width:190px;display:flex;flex-direction:column;gap:2px}
.menu button{justify-content:flex-start;border-color:transparent;width:100%;padding:7px 10px}
.menu small{display:block;color:var(--muted);font-weight:400;font-size:11px}

/* breadcrumb */
#crumbs{background:#f6f8fb;border-bottom:1px solid var(--line);padding:0 14px;height:32px;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;flex:none;font-size:12px}
#crumbs button{border-color:transparent;background:transparent;padding:3px 7px;color:var(--muted)}
#crumbs button.cur{color:var(--accent);font-weight:600;background:var(--accentL)}
#crumbs i{font-style:normal;color:#9aa8ba}

/* main */
#main{flex:1;display:flex;min-height:0}
#layers{width:250px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.ph{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;border-bottom:1px solid var(--line);background:#f6f8fb}
.count{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 7px;border-radius:10px;font-weight:500}
#layer-search{margin:10px 12px;width:calc(100% - 24px)}
#tree{flex:1;overflow:auto;padding:0 6px 10px}
.ti{width:100%;justify-content:flex-start;border-color:transparent;background:transparent;padding:5px 8px;font-weight:400;overflow:hidden;text-align:left;border-radius:3px;font-size:12px}
.ti .tg{font:600 10px ui-monospace,Menlo,Consolas,monospace;background:var(--line2);color:var(--muted);padding:1px 5px;border-radius:3px;flex:none}
.ti .tl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ti.active{background:var(--accentL);border-color:#b7cdf3;color:var(--accent)}
.ti.active .tg{background:var(--accent);color:#fff}
.ti.hid{opacity:.5;text-decoration:line-through}
#stage-wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#d9dfe8}
.cap{display:flex;justify-content:space-between;padding:8px 18px 0;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
#stage{flex:1;display:flex;justify-content:center;overflow:auto;padding:10px 18px 18px;min-height:0}
iframe{border:1px solid var(--line);background:#fff;height:100%;width:100%;box-shadow:var(--shadow);transition:width .2s;flex:none}
#panel{width:330px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#tabs{display:flex;border-bottom:1px solid var(--line);background:#f6f8fb}
.tab{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;background:transparent;padding:10px 2px;color:var(--muted);font-size:12px}
.tab:hover:not(:disabled){background:#eef3fb;border-color:transparent;border-bottom-color:var(--line)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:#fff;border-color:transparent;border-bottom-color:var(--accent)}
#pbody{flex:1;overflow:auto}
.empty{padding:26px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:6px}
.selcard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--accentL)}
.selcard code{margin-left:7px;font-size:11px;color:var(--muted)}
.selcard .sc-b{display:flex;gap:5px}
details.sec{border-bottom:1px solid var(--line2)}
details.sec>summary{cursor:pointer;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy2);list-style:none;display:flex;justify-content:space-between;background:#fafbfd}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"▾";color:var(--muted)}
details.sec:not([open])>summary:after{content:"▸"}
.sec-b{padding:10px 14px 6px}
.fld{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.fld>label{color:var(--muted);font-size:12px}
.ctl{display:flex;gap:6px;align-items:center;min-width:0}
.sfx{color:var(--muted);font-size:12px}
.stack{margin-bottom:6px}
.hint{color:var(--muted);font-size:12px;margin:2px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.seg{display:flex;width:100%}
.seg button{flex:1;border-radius:0;margin-left:-1px;padding:6px 4px}
.seg button:first-child{margin-left:0;border-radius:var(--r) 0 0 var(--r)}
.seg button:last-child{border-radius:0 var(--r) var(--r) 0}
.box4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.box4 label{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.box4 input{padding:5px 3px;text-align:center}
.thumb{border:1px solid var(--line);background:repeating-conic-gradient(#f0f2f5 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:var(--r);padding:6px;margin-bottom:8px;text-align:center}
.thumb img{max-width:100%;max-height:120px;display:inline-block}
.chk{display:flex;gap:7px;align-items:center;margin:2px 0 8px;color:var(--ink)}
.chk input{width:auto}

/* status bar */
#bottom{background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;padding:5px 16px;font-size:11px;color:var(--muted);flex:none}
#bottom .warn{color:var(--warn);font-weight:600}
#bottom .bad{color:var(--danger);font-weight:600}
#msg{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:11px 18px;border-radius:var(--r);font-weight:500;display:none;z-index:200;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#msg.err{background:var(--danger)}
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:150}
#login>div{background:#fff;border-radius:8px;padding:30px;width:380px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#login h2{margin:0 0 4px;font-size:20px}
#login input{margin:10px 0;padding:11px;font-size:14px}
#login button{width:100%;padding:11px;font-size:14px}
.muted{color:var(--muted)}
#lerr{color:var(--danger);margin:8px 0 0}

@media(max-width:1100px){#layers{width:200px}#panel{width:296px}#top .loc{display:none}}
@media(max-width:820px){#layers{display:none}#panel{width:280px}#top .sub,#top .sep,#top a.vs{display:none}}
@media(max-width:600px){#main{flex-direction:column}#stage-wrap{flex:none;height:46%}#panel{width:100%;border-left:0;border-top:1px solid var(--line);flex:1;min-height:0}#vp,.cap{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login"><div>
  <h2 id="lt">Site Admin</h2>
  <p id="ld" class="muted" style="margin:0"></p>
  <input type="password" id="lpw" placeholder="Password" autocomplete="current-password">
  <input type="password" id="lpw2" placeholder="Repeat password" style="display:none" autocomplete="new-password">
  <button id="lgo" class="primary">Sign in</button>
  <p id="lerr"></p>
</div></div>

<header id="top">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M5 4v16M19 4v16M5 12h14"/></svg></div>
  <div><div class="ttl">Holden Admin</div><div class="sub">Website management</div></div>
  <span class="sep"></span><span class="loc">holden11 / Home Services</span>
  <span class="sp"></span>
  <span class="status" id="save-status">All changes saved</span>
  <a class="vs" href="index.html" id="view-site" target="_blank" rel="noopener">View site ↗</a>
  <button class="primary" id="save" title="Ctrl+S">Save &amp; publish</button>
</header>

<div id="toolbar">
  <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <span class="vr"></span>
  <div class="pop">
    <button id="add" class="primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add element</button>
    <div class="menu" id="addmenu" hidden>
      <button data-add="heading">Heading</button>
      <button data-add="text">Paragraph</button>
      <button data-add="button">Button</button>
      <button data-add="image">Image <small>(upload)</small></button>
      <button data-add="section">Section</button>
      <button data-add="divider">Divider line</button>
      <button data-add="spacer">Spacer</button>
    </div>
  </div>
  <span class="vr"></span>
  <button class="dev on" data-w="100%" title="Desktop" aria-label="Desktop view"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button class="dev" data-w="768px" title="Tablet" aria-label="Tablet view"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M11 18h2"/></svg></button>
  <button class="dev" data-w="390px" title="Mobile" aria-label="Mobile view"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="1.5"/><path d="M11 18h2"/></svg></button>
  <span id="vp">Desktop · 100%</span>
  <span class="sp"></span>
  <button id="outlines" class="on" title="Show borders around every element"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 2"/></svg> Borders</button>
  <select id="hist" aria-label="Version history"><option value="">Version history…</option></select>
  <button class="danger" id="reset" title="Reset the site to the original design">Reset</button>
</div>

<div id="crumbs" aria-label="Selection path"></div>

<div id="main">
  <aside id="layers">
    <div class="ph">Structure <span class="count" id="element-count">0</span></div>
    <input type="text" id="layer-search" placeholder="Search elements…" aria-label="Search elements">
    <div id="tree"></div>
  </aside>
  <div id="stage-wrap">
    <div class="cap"><span>Home page</span><span id="canvas-state">Live canvas</span></div>
    <div id="stage"><iframe id="f" title="Website editing canvas" src="index.html?edit=1"></iframe></div>
  </div>
  <aside id="panel">
    <div id="tabs" role="tablist">
      <button class="tab on" data-tab="content">Content</button>
      <button class="tab" data-tab="style">Style</button>
      <button class="tab" data-tab="layout">Layout</button>
      <button class="tab" data-tab="adv">Advanced</button>
      <button class="tab" data-tab="site">Site</button>
    </div>
    <div id="pbody"></div>
  </aside>
</div>

<div id="bottom"><span id="selection-status">No element selected</span><span id="size-status"></span><span>Click: select · Double-click: edit text · Delete: remove · Ctrl+Z: undo</span></div>
<input type="file" id="file" accept="image/*" hidden>
<div id="msg" role="status"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const f=$("f"),pb=$("pbody");
const preview=new URLSearchParams(location.search).has("preview");
const D=()=>{try{return f.contentDocument}catch(e){return null}};
const W=()=>f.contentWindow;
const S=()=>{const d=D();return d&&d.getElementById("site")};
let PW=sessionStorage.getItem("hpw")||"",sel=null,hist=[],hi=-1,isDirty=false,fileCb=null,editing=null,tab="content",outlines=true,selBox=null,hovBox=null,readyTok=0,bside="",copied=null,sizeT=0;
const closed=new Set();
const SKIP=new Set(["SCRIPT","STYLE","LINK","BR","NOSCRIPT"]);
const INLINE=new Set(["SPAN","B","I","EM","STRONG","SMALL","U","IMG","LABEL","SUP","SUB"]);
const NAMES={H1:"Heading 1",H2:"Heading 2",H3:"Heading 3",H4:"Heading 4",P:"Paragraph",A:"Link",IMG:"Image",SECTION:"Section",ARTICLE:"Card",FOOTER:"Footer",HEADER:"Header",NAV:"Navigation",BUTTON:"Button",SPAN:"Text",DIV:"Block",UL:"List",LI:"List item",HR:"Divider",B:"Bold text",STRONG:"Bold text",EM:"Emphasis",I:"Italic text",SMALL:"Small text"};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toast=(t,e)=>{const m=$("msg");m.textContent=t;m.className=e?"err":"";m.style.display="block";clearTimeout(m.t);m.t=setTimeout(()=>m.style.display="none",e?6000:3800)};
const inSite=t=>{const s=S();return !!(t&&t.nodeType===1&&s&&s.contains(t))};
const textNodes=el=>Array.from(el.childNodes).filter(n=>n.nodeType===3&&n.textContent.trim());
const ownText=el=>Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join(" ").replace(/\s+/g," ").trim();
function nice(el){
  let n=NAMES[el.tagName]||el.tagName.toLowerCase();
  if(el.tagName==="A"&&/(^|\s)btn(\s|$)/.test(el.className))n="Button";
  const c=el.classList[0];return n+(c?" · ."+c:"");
}
function toHex(c){
  if(!c||c==="transparent")return "";
  const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return /^#[0-9a-f]{6}$/i.test(c)?c:"";
  const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);
  if(p.length>=4&&p[3]===0)return "";
  return "#"+p.slice(0,3).map(n=>Math.round(n).toString(16).padStart(2,"0")).join("");
}
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

/* ============ server ============ */
async function api(method,qs="",body,pw=PW){
  const r=await fetch("/api/content"+qs,{method,headers:{"Content-Type":"application/json","x-admin-password":pw},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("Request failed ("+r.status+")"));
  return d;
}
async function boot(){
  let st={};
  try{st=await (await fetch("/api/content?status=1")).json()}catch(e){$("lerr").textContent="Can't reach the Netlify function. Open this page from your live Netlify address, not from a file.";return}
  if(st.needsSetup){
    $("ld").textContent="First time here: create your admin password (8+ characters). You will use it every time you sign in.";
    $("lgo").textContent="Create password";$("lpw2").style.display="";$("lgo").dataset.mode="setup";
  }else{
    $("ld").textContent="Enter your admin password.";
    if(PW){try{await api("GET","?check=1");return unlock()}catch(e){}}
  }
}
$("lgo").onclick=async()=>{
  const p=$("lpw").value,setup=$("lgo").dataset.mode==="setup";$("lerr").textContent="";
  try{
    if(setup){if(p!==$("lpw2").value)throw new Error("Passwords don't match.");await api("POST","",{action:"setup",password:p},"")}
    await api("GET","?check=1",null,p);PW=p;sessionStorage.setItem("hpw",p);unlock();
  }catch(e){$("lerr").textContent=e.message}
};
[$("lpw"),$("lpw2")].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")$("lgo").click()}));
function unlock(){$("login").style.display="none";loadHist()}
if(preview){
  $("login").style.display="none";$("save").textContent="Export HTML";$("canvas-state").textContent="Local draft";
  $("hist").disabled=true;$("reset").title="Restore the original local draft";
}else boot();

/* ============ undo / redo ============ */
function snap(silent){
  const s=S();if(!s)return;
  const h=s.innerHTML;if(hist[hi]===h)return;
  hist=hist.slice(0,hi+1);hist.push(h);if(hist.length>80)hist.shift();hi=hist.length-1;
  if(!silent)setDirty(true);
  btns();queueSize();
}
function go(i){
  if(i<0||i>=hist.length)return;
  if(editing)stopEdit();
  hi=i;S().innerHTML=hist[i];sel=null;setDirty(true);btns();select(null);queueSize();
}
function btns(){$("undo").disabled=hi<=0;$("redo").disabled=hi>=hist.length-1}
function setDirty(v){
  isDirty=v;const s=$("save-status");
  s.textContent=v?"Unsaved changes":(preview?"Local draft":"All changes saved");
  s.classList.toggle("dirty",v);
}
$("undo").onclick=()=>go(hi-1);$("redo").onclick=()=>go(hi+1);
window.addEventListener("beforeunload",e=>{if(isDirty){e.preventDefault();e.returnValue=""}});
function commit(){snap();upd();renderTree();renderCrumbs()}

function serialize(){
  const c=S().cloneNode(true);
  c.querySelectorAll("[contenteditable]").forEach(e=>e.removeAttribute("contenteditable"));
  const n=c.querySelector("#mnav");if(n)n.classList.remove("show");
  const b=c.querySelector("#burger");if(b)b.setAttribute("aria-expanded","false");
  c.querySelectorAll('[style=""]').forEach(e=>e.removeAttribute("style"));
  return c.innerHTML;
}
function queueSize(){
  clearTimeout(sizeT);
  sizeT=setTimeout(()=>{
    const s=S();if(!s)return;
    const b=new Blob([JSON.stringify({html:serialize()})]).size,el=$("size-status");
    el.textContent="Page size: "+fmt(b);el.className=b>5.5*1048576?"bad":b>4*1048576?"warn":"";
    el.title="Publishing works up to about 5.5 MB. Large photos count toward this.";
  },300);
}

/* ============ canvas overlay + events ============ */
function injectCss(){
  const d=D();if(d.getElementById("__editorstyle"))return;
  const st=d.createElement("style");st.id="__editorstyle";
  st.textContent=
  "body.edit-preview a,body.edit-preview button{pointer-events:auto!important}"+
  "body.edit-preview #site *{cursor:default!important}"+

    +fld("Weight",selIn("fontWeight",[["300","Light"],["400","Regular"],["500","Medium"],["600","Semi-bold"],["700","Bold"],["800","Extra bold"],["900","Black"]],cs.fontWeight))
    +fld("Format",`<div class="seg">${tg("bold","<b>B</b>",bold,"Bold")}${tg("italic","<i>I</i>",ital,"Italic")}${tg("underline","<u>U</u>",dl.includes("underline"),"Underline")}${tg("strike","<s>S</s>",dl.includes("line-through"),"Strikethrough")}</div>`)
    +fld("Align",`<div class="seg">${as("left","Left")}${as("center","Center")}${as("right","Right")}${as("justify","Full")}</div>`)
    +fld("Line height",numIn("lineHeight",lh,{unit:"",step:.1,min:0,ph:"auto"}))
    +fld("Spacing",numIn("letterSpacing",ls,{step:.5,sfx:"px"}))
    +fld("Case",selIn("textTransform",[["none","Normal"],["uppercase","UPPERCASE"],["lowercase","lowercase"],["capitalize","Capitalize"]],cs.textTransform)));
  h+=sec("Colors",
    fld("Text color",colorCtl("css","color",col,["reset","color"]))
    +fld("Background",colorCtl("css","backgroundColor",bgc,["reset","backgroundColor"]))
    +fld("Opacity",`<input type="number" data-css="opacity" data-kind="pct" min="0" max="100" step="5" value="${opv}"><span class="sfx">%</span>`));
  h+=sec("Background image & gradient",
    `<div class="grid2"><button class="primary" data-act="up-bg">⬆ Upload image</button><button data-act="rm-bg">Remove</button></div>`
    +fld("Size",selIn("backgroundSize",[["cover","Cover"],["contain","Contain"],["auto","Original size"],["100% 100%","Stretch"]],cs.backgroundSize))
    +fld("Position",selIn("backgroundPosition",[["center","Center"],["top","Top"],["bottom","Bottom"],["left","Left"],["right","Right"]],sel.style.backgroundPosition))
    +fld("Repeat",selIn("backgroundRepeat",[["no-repeat","No repeat"],["repeat","Tile"],["repeat-x","Tile across"],["repeat-y","Tile down"]],cs.backgroundRepeat))
    +`<div class="hint" style="margin-top:6px">Gradient</div>`
    +fld("From",colorCtl("grad","c1","#1796d0"))+fld("To",colorCtl("grad","c2","#0b4f93"))
    +fld("Angle",`<input type="number" data-grad="angle" value="135" min="0" max="360"><span class="sfx">°</span>`)
    +`<div class="grid2"><button data-act="grad">Apply gradient</button><button data-act="reset-bg">Restore original</button></div>`);
  h+=sec("Border",
    fld("Side",`<select data-bside>${opt([["","All sides"],["Top","Top"],["Right","Right"],["Bottom","Bottom"],["Left","Left"]],bside)}</select>`)
    +fld("Width",`<input type="number" data-border="width" min="0" max="40" value="${bw}"><span class="sfx">px</span>`)
    +fld("Style",`<select data-border="style">${opt(["none","solid","dashed","dotted","double","groove"].map(v=>[v,v[0].toUpperCase()+v.slice(1)]),bst)}</select>`)
    +fld("Color",colorCtl("border","color",bc))
    +fld("Corners",`<input type="number" data-border="radius" min="0" value="${px("borderTopLeftRadius")}"><span class="sfx">px</span>`));
  h+=sec("Effects",fld("Shadow",`<select data-css="boxShadow">${shadowOpts()}</select>`));
  return h;
}
const SHADOWS=[["","None"],["0 1px 3px rgba(0,0,0,.22)","Subtle"],["0 4px 14px rgba(0,0,0,.2)","Medium"],["0 12px 32px rgba(0,0,0,.3)","Strong"]];
function normShadow(v){const t=D().createElement("div");t.style.boxShadow=v;return t.style.boxShadow}
function shadowOpts(){
  const cur=sel.style.boxShadow;let found=false;
  let o=SHADOWS.map(x=>{const on=normShadow(x[0])===cur;if(on)found=true;return `<option value="${esc(x[0])}"${on?" selected":""}>${x[1]}</option>`}).join("");
  if(cur&&!found)o+=`<option value="${esc(cur)}" selected>Custom</option>`;
  return o;
}

function layoutTab(){
  const cs=W().getComputedStyle(sel),r=sel.getBoundingClientRect(),px=p=>Math.round(parseFloat(cs[p])*10)/10||0;
  const b4=pre=>`<div class="box4">${["Top","Right","Bottom","Left"].map(s=>`<label><span>${s[0]}</span><input type="text" data-css="${pre}${s}" data-unit="px" value="${esc(sel.style[pre+s])}" placeholder="${px(pre+s)}"></label>`).join("")}</div>`;
  let h="";
  h+=sec("Size",fld("Width",txtIn("width",sel.style.width,Math.round(r.width)+"px"))+fld("Height",txtIn("height",sel.style.height,Math.round(r.height)+"px"))+fld("Min height",txtIn("minHeight",sel.style.minHeight,"none"))+fld("Max width",txtIn("maxWidth",sel.style.maxWidth,"none")));
  h+=sec("Padding (inside)",fld("All sides",`<input type="text" data-all="padding" placeholder="e.g. 16">`)+b4("padding"));
  h+=sec("Margin (outside)",fld("All sides",`<input type="text" data-all="margin" placeholder="e.g. 16 or auto">`)+b4("margin"));
  h+=sec("Display & alignment",
    fld("Display",selIn("display",[["block","Block"],["inline-block","Inline block"],["inline","Inline"],["flex","Flex row/column"],["grid","Grid"]],cs.display))
    +fld("Direction",selIn("flexDirection",[["","(default)"],["row","Row"],["column","Column"]],sel.style.flexDirection))
    +fld("Wrap",selIn("flexWrap",[["","(default)"],["nowrap","No wrap"],["wrap","Wrap"]],sel.style.flexWrap))
    +fld("Justify",selIn("justifyContent",[["","(default)"],["flex-start","Start"],["center","Center"],["flex-end","End"],["space-between","Space between"],["space-around","Space around"]],sel.style.justifyContent))
    +fld("Align items",selIn("alignItems",[["","(default)"],["stretch","Stretch"],["flex-start","Start"],["center","Center"],["flex-end","End"]],sel.style.alignItems))
    +fld("Gap",txtIn("gap",sel.style.gap,String(px("columnGap")||0)))
    +'<p class="hint">Direction, wrap, justify, align and gap take effect when Display is Flex or Grid.</p>');
  return h;
}

function advTab(){
  return sec("Identity",fld("Element ID",`<input type="text" data-attr="id" value="${esc(sel.id)}">`)+fld("CSS classes",`<input type="text" data-attr="class" value="${esc(sel.className)}">`))
  +sec("Inline CSS",`<textarea class="code" data-csstext rows="7" spellcheck="false">${esc((sel.getAttribute("style")||"").split(";").map(x=>x.trim()).filter(Boolean).join(";\n"))}</textarea><div class="grid2" style="margin-top:8px"><button class="primary" data-act="apply-css">Apply CSS</button><button class="danger" data-act="clear-style">Clear all styles</button></div>`)
  +sec("HTML source",`<textarea class="code" id="innerhtml" rows="7" spellcheck="false">${esc(sel.innerHTML)}</textarea><button class="wide" style="margin-top:8px" data-act="apply-html">Apply HTML</button>`)
  +findBlock();
}
const findBlock=()=>sec("Find & replace (whole page)",`<input type="text" id="fa" class="stack" placeholder="Find, e.g. 555-555-5555"><input type="text" id="fb" class="stack" placeholder="Replace with"><button class="wide" data-act="fr">Replace everywhere</button><p class="hint">Changes text and link addresses across the entire page.</p>`);

function siteTab(){
  const t=S().querySelector("#__admin-theme"),d=t?t.dataset:{},css=(S().querySelector("#__admin-css")||{}).textContent||"";
  const fam=(d.font||"").split(",")[0].replace(/['"]/g,"").trim();
  return sec("Page defaults",
    fld("Background",colorCtl("theme","bg",d.bg||"",["treset","bg"]))
    +fld("Text color",colorCtl("theme","color",d.color||"",["treset","color"]))
    +fld("Font",fontSelect("theme",fam))
    +`<button class="wide" data-treset="font">Reset font</button><p class="hint">Applies to the whole page. Anything you style individually keeps its own look.</p>`)
  +sec("Custom CSS (whole site)",`<textarea class="code" id="sitecss" rows="8" spellcheck="false" placeholder=".btn{border-radius:6px}">${esc(css)}</textarea><button class="wide primary" style="margin-top:8px" data-act="site-css">Apply CSS</button>`)
  +findBlock();
}

/* ---- inspector events ---- */
const cssVal=t=>{const v=t.value.trim();if(v==="")return "";return t.dataset.unit&&/^-?\d*\.?\d+$/.test(v)?v+t.dataset.unit:v};
function colorValue(t,final){
  let v=t.value.trim();
  if(t.dataset.kind==="hex"){
    if(/^[0-9a-f]{3,8}$/i.test(v))v="#"+v;
    if(v&&!CSS.supports("color",v)){if(final)toast("“"+v+"” isn't a valid color.",1);return null}
  }
  return v;
}
function syncPair(t,v){
  const root=t.closest(".ctl"),c=root.querySelector("input[type=color]"),h=root.querySelector("input.hex");
  if(t!==c&&/^#[0-9a-f]{6}$/i.test(v))c.value=v;
  if(t!==h)h.value=v;
}
function setProp(prop,v){
  if(prop==="backgroundColor"&&v&&!sel.style.backgroundImage&&W().getComputedStyle(sel).backgroundImage!=="none")sel.style.backgroundImage="none";
  sel.style[prop]=v;
}
function applyBorder(kind,v){
  if(kind==="radius"){sel.style.borderRadius=v===""?"":v+"px";return}
  const P="border"+bside+kind[0].toUpperCase()+kind.slice(1),probe="border"+(bside||"Top")+"Style";
  sel.style[P]=kind==="width"?(v===""?"":v+"px"):v;
  const style=W().getComputedStyle(sel)[probe];
  if(kind==="width"&&+v>0&&style==="none")sel.style["border"+bside+"Style"]="solid";
  if(kind==="style"&&v!=="none"&&!(parseFloat(W().getComputedStyle(sel)["border"+(bside||"Top")+"Width"])>0))sel.style["border"+bside+"Width"]="1px";
}
function onField(e,final){
  const t=e.target,d=t.dataset;if(!d)return;
  if(d.theme!==undefined){
    const v=colorValue(t,final);if(v===null)return;syncPair(t,v);setTheme(d.theme,v);if(final)commit();return;
  }
  if(d.font==="theme"||d.fontname==="theme"){
    if(!final)return;
    if(d.fontname)t.value.trim()?applyFont("theme",t.value.trim(),true):setTheme("font","");else applyFont("theme",t.value);
    commit();renderPanel();return;
  }
  if(d.bside!==undefined){bside=t.value;renderPanel();return}
  if(!sel)return;
  if(d.font==="el"||d.fontname==="el"){
    if(!final)return;
    if(d.fontname){if(!t.value.trim())return;applyFont("el",t.value.trim(),true)}else if(t.value==="")sel.style.fontFamily="";else applyFont("el",t.value);
    commit();renderPanel();return;
  }
  if(d.border){
    const v=d.border==="color"?colorValue(t,final):t.value;if(v===null)return;
    if(d.border==="color")syncPair(t,v);
    applyBorder(d.border,v);upd();if(final)commit();return;
  }
  if(d.grad!==undefined){if(d.kind==="color"||d.kind==="hex"){const v=colorValue(t,final);if(v!==null)syncPair(t,v)}return}
  if(d.attr){
    const el=d.on==="a"?sel.closest("a"):sel;if(!el)return;
    const v=t.value;
    if(d.attr==="src"&&!v.trim())return;
    if(d.attr==="class")el.className=v;
    else if(v===""&&d.attr!=="alt")el.removeAttribute(d.attr);
    else el.setAttribute(d.attr,v);
    upd();if(final)commit();return;
  }
  if(d.newtab!==undefined){const a=sel.closest("a");if(a){if(t.checked){a.target="_blank";a.rel="noopener"}else{a.removeAttribute("target");a.removeAttribute("rel")}commit()}return}
  if(d.txt!==undefined){sel.textContent=t.value;upd();if(final)commit();return}
  if(d.node!==undefined){const n=textNodes(sel)[+d.node];if(n){n.textContent=t.value;upd()}if(final)commit();return}
  if(d.all){
    if(!final)return;const v=cssVal(Object.assign({},{value:t.value,dataset:{unit:"px"}}));
    sel.style[d.all]=v.split(/\s+/).map(x=>/^-?\d*\.?\d+$/.test(x)?x+"px":x).join(" ");commit();renderPanel();return;
  }
  if(d.css){
    let v;
    if(d.kind==="color"||d.kind==="hex"){v=colorValue(t,final);if(v===null)return;syncPair(t,v)}
    else if(d.kind==="pct")v=t.value===""?"":String(Math.min(100,Math.max(0,+t.value))/100);
    else v=cssVal(t);
    setProp(d.css,v);upd();if(final)commit();
  }
}
pb.addEventListener("input",e=>onField(e,false));
pb.addEventListener("change",e=>onField(e,true));
pb.addEventListener("toggle",e=>{const x=e.target;if(x.tagName==="DETAILS"){const k=x.querySelector("summary").textContent;x.open?closed.delete(k):closed.add(k)}},true);
pb.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-reset],[data-treset],[data-tg],[data-set]");if(!b)return;
  const d=b.dataset;
  if(d.act)return act(d.act);
  if(d.treset){if(d.treset==="font")setTheme("font","");else setTheme(d.treset,"");commit();return renderPanel()}
  if(!sel)return;
  if(d.reset){sel.style[d.reset]="";if(d.reset==="backgroundColor"&&sel.style.backgroundImage==="none")sel.style.backgroundImage="";commit();return renderPanel()}
  if(d.set){const kv=d.set.split(":");sel.style[kv[0]]=kv[1];commit();return renderPanel()}
  if(d.tg){
    const cs=W().getComputedStyle(sel);
    if(d.tg==="bold")sel.style.fontWeight=parseInt(cs.fontWeight)>=600?"400":"700";
    else if(d.tg==="italic")sel.style.fontStyle=cs.fontStyle==="italic"?"normal":"italic";
    else{
      const cur=(cs.textDecorationLine||"").split(" ").filter(x=>x&&x!=="none"),k=d.tg==="underline"?"underline":"line-through",i=cur.indexOf(k);
      i>=0?cur.splice(i,1):cur.push(k);sel.style.textDecorationLine=cur.join(" ")||"none";
    }
    commit();renderPanel();
  }
});

function act(a){
  if(a==="site-css"){
    const v=$("sitecss").value.trim();
    if(v)themeEl("__admin-css").textContent=v;else{const x=S().querySelector("#__admin-css");if(x)x.remove()}
    commit();return toast("Custom CSS applied.");
  }
  if(a==="fr")return replaceAll();
  if(!sel)return;
  const p=sel.parentElement;
  switch(a){
    case"parent":return select(p&&inSite(p)&&p!==S()?p:null,{scroll:true});
    case"edit":return startEdit(sel);
    case"up-img":return pickFile(1400,u=>{sel.src=u;sel.removeAttribute("srcset");commit();renderPanel()});
    case"up-bg":return pickFile(1920,u=>{setBg(sel,u);commit();renderPanel()});
    case"rm-bg":sel.style.backgroundImage="none";commit();return renderPanel();
    case"reset-bg":sel.style.backgroundImage="";sel.style.backgroundColor="";commit();return renderPanel();
    case"grad":{
      const g=n=>pb.querySelector('[data-grad="'+n+'"][data-kind="hex"]');
      const c1=(g("c1")&&g("c1").value)||"#1796d0",c2=(g("c2")&&g("c2").value)||"#0b4f93",an=pb.querySelector('[data-grad="angle"]').value||135;
      sel.style.backgroundImage=`linear-gradient(${an}deg, ${c1}, ${c2})`;commit();return renderPanel();
    }
    case"dup":{
      const c=sel.cloneNode(true);c.removeAttribute("id");c.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));
      sel.after(c);commit();return select(c,{scroll:true});
    }
    case"del":{
      const n=sel.nextElementSibling||sel.previousElementSibling||p;
      const t=sel;sel=null;t.remove();commit();return select(n&&inSite(n)&&n!==S()&&!SKIP.has(n.tagName)?n:null);
    }
    case"mup":{const x=sel.previousElementSibling;if(x&&!SKIP.has(x.tagName)){x.before(sel);commit();renderPanel()}return}
    case"mdn":{const x=sel.nextElementSibling;if(x&&!SKIP.has(x.tagName)){x.after(sel);commit();renderPanel()}return}
    case"hide":sel.style.display=sel.style.display==="none"?"":"none";commit();return renderPanel();
    case"copy-style":copied=sel.getAttribute("style")||"";toast("Style copied. Select another element and press Paste.");return renderPanel();
    case"paste-style":if(copied!==null){sel.setAttribute("style",copied);commit();renderPanel()}return;
    case"apply-css":{
      const v=pb.querySelector("[data-csstext]").value.replace(/\n/g," ").trim();
      v?sel.setAttribute("style",v):sel.removeAttribute("style");commit();return renderPanel();
    }
    case"clear-style":sel.removeAttribute("style");commit();return renderPanel();
    case"apply-html":sel.innerHTML=$("innerhtml").value;commit();return renderPanel();
  }
}
function replaceAll(){
  const a=$("fa").value;if(!a)return;
  const s=S(),b=$("fb").value;let n=0;
  const w=D().createTreeWalker(s,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement&&["STYLE","SCRIPT"].includes(x.parentElement.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(x=>{const c=x.textContent.split(a).length-1;if(c){n+=c;x.textContent=x.textContent.split(a).join(b)}});
  s.querySelectorAll("[href],[alt],[title]").forEach(el=>["href","alt","title"].forEach(k=>{
    const v=el.getAttribute(k);if(v&&v.includes(a)){n+=v.split(a).length-1;el.setAttribute(k,v.split(a).join(b))}
  }));
  if(!n)return toast("Nothing found.",1);
  commit();renderPanel();toast("Replaced "+n+" place(s). Press Save & publish to go live.");
}

/* ============ toolbar ============ */
document.querySelectorAll(".dev").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".dev").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  f.style.width=b.dataset.w;$("vp").textContent=b.title+" · "+b.dataset.w;setTimeout(upd,260);
});
$("outlines").onclick=()=>{outlines=!outlines;$("outlines").classList.toggle("on",outlines);const d=D();if(d&&d.body)d.body.classList.toggle("ed-borders",outlines)};

async function save(){
  if(editing)stopEdit();
  if(!S())return;
  const html=serialize();
  if(preview){
    const d=D().documentElement.cloneNode(true);d.querySelector("#site").innerHTML=html;
    d.querySelectorAll("#__sel,#__hov,#__editorstyle").forEach(x=>x.remove());
    d.querySelector("body").classList.remove("ed-borders","edit-preview");
    const url=URL.createObjectURL(new Blob(["<!DOCTYPE html>\n"+d.outerHTML],{type:"text/html"})),a=document.createElement("a");
    a.href=url;a.download="index.html";a.click();URL.revokeObjectURL(url);setDirty(false);return toast("Website HTML exported.");
  }
  const bytes=new Blob([JSON.stringify({html})]).size;
  if(bytes>5.5*1048576)return toast("This page is too large to publish ("+fmt(bytes)+"). Use smaller or fewer images.",1);
  const btn=$("save");btn.disabled=true;btn.textContent="Publishing…";
  try{await api("POST","",{html});setDirty(false);toast("Published. Your live site is updated.");loadHist()}
  catch(err){toast(err.message,1)}
  finally{btn.disabled=false;btn.textContent="Save & publish"}
}
$("save").onclick=save;
$("reset").onclick=async()=>{
  if(preview){if(confirm("Discard local edits and restore the original website?")){setDirty(false);f.contentWindow.location.reload()}return}
  if(!confirm("Reset the live site to the original design? Your current version is kept in Version history."))return;
  try{await api("DELETE");toast("Reset. Reloading…");setDirty(false);setTimeout(()=>f.contentWindow.location.reload(),700)}
  catch(e){toast(e.message,1)}
};
async function loadHist(){
  try{
    const d=await api("GET","?list=1");
    $("hist").innerHTML='<option value="">Version history…</option>'+(d.backups||[]).map(k=>`<option value="${esc(k)}">${esc(new Date(+k.split(":")[1]).toLocaleString())}</option>`).join("");
  }catch(e){}
}
$("hist").onchange=async e=>{
  const k=e.target.value;e.target.value="";if(!k)return;
  if(!confirm("Load this older version into the editor? You can review it, then Save & publish to make it live."))return;
  try{const d=await api("GET","?backup="+encodeURIComponent(k));S().innerHTML=d.html;sel=null;snap();select(null);toast("Loaded. Press Save & publish to make it live.")}
  catch(err){toast(err.message,1)}
};
btns();
